<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Updates</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<style>
:root{--bg:#f6f5f2;--surface:#fff;--ink:#1c1b19;--muted:#6f6c66;--line:#e8e5de;--accent:#4f46e5;--accent-soft:#eceafd;--ok:#16a34a;--ok-soft:#e6f6ec;--warn:#d97706;--warn-soft:#fdf1de;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--surface:#1e1d1b;--ink:#f0eee8;--muted:#9a968d;--line:#2d2b28;--accent:#8b85ff;--accent-soft:#25234a;--ok:#4ade80;--ok-soft:#12301e;--warn:#fbbf24;--warn-soft:#38290e;--shadow:none}}
:root[data-theme="dark"]{--bg:#141413;--surface:#1e1d1b;--ink:#f0eee8;--muted:#9a968d;--line:#2d2b28;--accent:#8b85ff;--accent-soft:#25234a;--ok:#4ade80;--ok-soft:#12301e;--warn:#fbbf24;--warn-soft:#38290e;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0 8px 18px;display:flex;gap:8px;align-items:center}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-block}
.new{width:100%;padding:10px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-bottom:16px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.item:hover,.item.on{background:var(--accent-soft)}
.item b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-size:12px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.tag.Daily{background:var(--warn-soft);color:var(--warn)}
main{padding:28px clamp(16px,4vw,48px) 80px;max-width:980px;width:100%;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.meta input,.meta select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.meta input{flex:1;min-width:200px}
textarea{width:100%;min-height:60vh;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;resize:vertical;line-height:1.55;font-size:15px}
textarea:focus,.meta *:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:80px 0}
/* rendered report */
.doc h1{font-size:clamp(26px,4vw,38px);line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.doc .lead{color:var(--muted);font-size:18px;margin:0 0 28px;max-width:70ch}
.doc .kicker{display:inline-block;margin-bottom:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;margin:0 0 18px;box-shadow:var(--shadow);break-inside:avoid}
.sec>h2{font-size:20px;margin:0 0 14px;letter-spacing:-.01em;line-height:1.3}
.sec h3{font-size:14px;font-weight:700;margin:20px 0 8px;padding:5px 12px;border-radius:99px;background:var(--ok-soft);color:var(--ok);display:inline-block}
.sec h3:first-of-type{margin-top:0}
.doc h4{margin:16px 0 6px}
.doc ul{list-style:none;padding:0;margin:0 0 6px}
.doc li{position:relative;padding:7px 0 7px 22px;border-bottom:1px dashed var(--line)}
.doc li:last-child{border-bottom:0}
.doc li::before{content:"";position:absolute;left:4px;top:.95em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.doc li strong{color:var(--ink)}
.doc p{margin:0 0 10px}
.doc a{color:var(--accent);text-underline-offset:3px}
.doc img{max-width:100%;border-radius:12px;display:block;margin:12px 0}
.doc table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
.tw{overflow-x:auto}
.doc th{text-align:left;background:var(--accent-soft);color:var(--accent);padding:9px 12px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.doc td{padding:9px 12px;border-bottom:1px solid var(--line)}
.doc blockquote{margin:10px 0;padding:8px 16px;border-left:3px solid var(--accent);color:var(--muted);background:var(--accent-soft);border-radius:0 10px 10px 0}
.doc code{background:var(--accent-soft);padding:2px 6px;border-radius:6px;font-size:.9em}
.doc pre{background:var(--accent-soft);padding:14px;border-radius:12px;overflow:auto}
.doc hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.sec.s-prog>h2::after,.sec.s-done>h2::after{font-size:12px;font-weight:700;margin-left:10px;padding:3px 10px;border-radius:99px;vertical-align:middle}
.sec.s-done>h2::after{content:"DONE";background:var(--ok-soft);color:var(--ok)}
.sec.s-prog>h2::after{content:"IN PROGRESS";background:var(--warn-soft);color:var(--warn)}
.sec.s-prog h3{background:var(--warn-soft);color:var(--warn)}
body.present aside,body.present .bar,body.present .hint{display:none}
body.present .app{grid-template-columns:1fr}
body.present main{max-width:1100px;padding-top:40px}
body.present .doc{font-size:19px}
.exit{display:none;position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5}
body.present .exit{display:block}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
@media print{aside,.bar,.hint,.exit{display:none!important}.app{display:block}body{background:#fff}.sec{box-shadow:none}}

.sel,.ttl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.ttl{flex:1;min-width:160px;max-width:340px}
.status{font-size:13px;color:var(--muted)}
.linkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-8px 0 16px}
.linkrow input{flex:1;min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.split textarea{min-height:70vh}
body.viewer .ed,body.viewer .split #edit{display:none}
body.viewer .split{grid-template-columns:1fr}
body.viewer.hasid aside{display:none}
body.viewer.hasid .app{grid-template-columns:1fr}
body.viewer main{max-width:980px}
body.editor main{max-width:1500px}
.viewonly{display:none}
body.viewer .viewonly{display:inline-block;margin-top:8px}
body.present .split{grid-template-columns:1fr}
body.present #edit,body.present .viewonly,body.present .linkrow{display:none}
@media(max-width:1100px){.split{grid-template-columns:1fr}.split textarea{min-height:40vh}}
@media print{.viewonly{display:none!important}}
/* Auth overlay (login/signup) */
#auth-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;backdrop-filter:blur(4px)}
#auth-overlay.open{display:flex;align-items:center;justify-content:center}
#auth-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px;max-width:360px;width:90%;text-align:center;box-shadow:var(--shadow)}
#auth-box h2{margin:0 0 20px;font-size:20px}
#auth-box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-size:15px;box-sizing:border-box}
#auth-box .auth-error{color:var(--warn);font-size:13px;margin-bottom:14px;display:none;text-align:left}
#auth-box button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:15px;margin-bottom:10px}
#auth-box button:hover{opacity:.9}
#auth-box .toggle{margin-top:12px;font-size:13px;color:var(--muted)}
#auth-box .toggle a{color:var(--accent);cursor:pointer;text-decoration:none}
#auth-box .toggle a:hover{text-decoration:underline}
#auth-user{font-size:13px;color:var(--muted);margin-left:8px}
#auth-user .btn-logout{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
#auth-user .btn-logout:hover{opacity:.8}
</style>
</head>
<body>
<div id="auth-overlay">
  <div id="auth-box">
    <h2 id="auth-title">Sign in to edit</h2>
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-password" placeholder="Password">
    <div class="auth-error" id="auth-error"></div>
    <button id="auth-btn">Sign in</button>
    <div class="toggle" id="auth-toggle">Don't have an account? <span id="auth-switch">Sign up</span></div>
  </div>
</div>
<button class="btn exit" id="exit">Exit presentation</button>
<div class="app">
<aside>
  <div class="brand"><i></i>Team Updates</div>
  <button class="new ed" id="new">+ New update</button>
  <div id="list"></div>
</aside>
<main>
  <div class="bar ed">
    <select id="type" class="sel"><option>Weekly</option><option>Daily</option></select>
    <input id="title" class="ttl" placeholder="Title (optional)">
    <span id="bar-sp" class="sp"></span>
    <button id="auth-login-btn" class="btn">Login</button>
    <span class="status" id="status"></span>
    <button class="btn" id="del">Delete</button>
    <button class="btn" id="present">Present</button>
    <button class="btn" id="copy">Copy link</button>
    <button class="btn pri" id="pub">Publish</button>
  </div>
  <div class="linkrow ed" id="linkrow" hidden><input id="linkbox" readonly><span class="hint">Link copied. Anyone with this link can open the update. Click Publish after edits and their page refreshes by itself.</span></div>
  <div class="split">
    <div id="edit" class="ed">
      <textarea id="src" placeholder="Paste your update here: text, bullets, emojis, tables, links, images…"></textarea>
      <div class="hint">Formatting is automatic. Click Publish to send your changes to the link.</div>
    </div>
    <article id="view" class="doc"><div class="empty">Connecting…</div></article>
  </div>
  <button class="btn viewonly" id="present2">Present</button>
</main>
</div>
<script type="application/json" id="data">{"updates":[]}</script>
<script>
const SRC="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
const $=id=>document.getElementById(id);
let cur = null, dirty = false;
let items = [];

async function loadItems() {
  try {
    const { data, error } = await sb.from("updates").select("*").order("at", { ascending: false });
    if (error) { console.error("Supabase load error:", error); throw error; }
    if (data) items = data;
  } catch(e) {
    console.error("Supabase unavailable, falling back to localStorage:", e);
    try { items = (JSON.parse(localStorage.getItem("team_updates")) || []); } catch(_) { items = []; }
  }
}
const SUPABASE_URL = "https://ozbnducbpvbdewyerbkn.supabase.co";
const SUPABASE_KEY = "sb_publishable_43wD1ERo2QA8csAh0vsQkg_hQecLWMZ";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Auth state
let user = null;
let canEdit = false;
let authMode = 'signin'; // 'signin' | 'signup'

// 1. Detect edit mode via ?edit=1 in the URL
const hashId=()=>location.hash.slice(1);
const setStatus=t=>{$("status").textContent=t};

const isEditor = new URLSearchParams(location.search).has('edit');
const h0 = hashId();

// 2. Listen to Supabase Auth state changes
sb.auth.onAuthStateChange((event, session) => {
  user = session?.user ?? null;
  canEdit = !!user;
  updateAuthUI();
  maybeAddLogoutBtn();
});

// Update auth UI based on login state
function updateAuthUI() {
  const overlay = $("auth-overlay");
  const editorEl = document.body;
  const loginBtn = $("auth-login-btn");
  
  if (user) {
    // Logged in — hide auth overlay, hide login button, enable editor if ?edit=1
    overlay.classList.remove("open");
    loginBtn.style.display = "none";
    if (isEditor) {
      editorEl.classList.remove("viewer");
      editorEl.classList.add("editor");
    } else {
      editorEl.classList.remove("editor");
      editorEl.classList.add("viewer");
      $("exit").style.display = "none";
    }
  } else {
    // Not logged in — show login button, show auth overlay if ?edit=1
    loginBtn.style.display = "inline-block";
    if (isEditor) {
      overlay.classList.add("open");
      editorEl.classList.remove("editor");
      editorEl.classList.add("viewer");
      $("exit").style.display = "none";
    } else {
      editorEl.classList.remove("editor");
      editorEl.classList.add("viewer");
      $("exit").style.display = "none";
    }
  }
}

// Render auth form (signin or signup)
function renderAuthForm() {
  const title = $("auth-title");
  const btn = $("auth-btn");
  const toggle = $("auth-toggle");
  const switchText = $("auth-switch");
  const emailInput = $("auth-email");
  const passInput = $("auth-password");
  
  if (authMode === 'signin') {
    title.textContent = "Sign in to edit";
    btn.textContent = "Sign in";
    toggle.innerHTML = "Don't have an account? <span id='auth-switch' style='color:var(--accent);cursor:pointer;text-decoration:none'>Sign up</span>";
    switchText.style.cursor = "pointer";
  } else {
    title.textContent = "Create account";
    btn.textContent = "Sign up";
    toggle.innerHTML = "Already have an account? <span id='auth-switch' style='color:var(--accent);cursor:pointer;text-decoration:none'>Sign in</span>";
    switchText.style.cursor = "pointer";
  }
  
  // Re-wire switch click
  const switchEl = $("auth-switch");
  switchEl.onclick = () => {
    authMode = authMode === 'signin' ? 'signup' : 'signin';
    $("auth-error").textContent = "";
    $("auth-error").style.display = "none";
    renderAuthForm();
  };
  
  // Re-wire submit
  btn.onclick = handleAuthSubmit;
  [emailInput, passInput].forEach(inp => {
    inp.onkeydown = (e) => { if (e.key === "Enter") handleAuthSubmit(); };
  });
  
  emailInput.focus();
}

// Handle sign in / sign up
async function handleAuthSubmit() {
  const email = $("auth-email").value.trim();
  const password = $("auth-password").value.trim();
  const err = $("auth-error");
  err.textContent = "";
  err.style.display = "none";
  
  if (!email || !password) {
    err.textContent = "Please enter both email and password.";
    err.style.display = "block";
    return;
  }
  
  try {
    if (authMode === 'signin') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      err.textContent = "Account created. Please sign in.";
      err.style.display = "block";
      authMode = 'signin';
      renderAuthForm();
    }
  } catch(e) {
    err.textContent = e.message || "Authentication failed.";
    err.style.display = "block";
  }
}

// Logout
async function handleLogout() {
  await sb.auth.signOut();
  user = null;
  canEdit = false;
  updateAuthUI();
  location.reload();
}

// Login button click
$("auth-login-btn").onclick = () => {
  $("auth-overlay").classList.add("open");
  renderAuthForm();
};

// Add logout button to editor bar when logged in
function maybeAddLogoutBtn() {
  if ($("auth-logout")) return;
  if (!user) return;
  const sp = $("bar-sp") || null;
  const btn = document.createElement("button");
  btn.id = "auth-logout";
  btn.className = "btn";
  btn.textContent = "Logout (" + (user.email || "user") + ")";
  btn.onclick = handleLogout;
  // Insert before the Present button
  const presentBtn = $("present");
  presentBtn.parentNode.insertBefore(btn, presentBtn);
}

function buildHtml(){
  const json=JSON.stringify({updates:items}).replace(/</g,"\\u003c");
  return SRC.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b)
}
const EMO=/^\p{Extended_Pictographic}/u;
const isBul=l=>/^\s*[•▸▪◦\-\*]\s+/.test(l);
function normalize(raw){
  let L=raw.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,""));
  const out=[];let first=true;
  const nxt=i=>{for(let j=i+1;j<L.length;j++){if(L[j].trim())return L[j]}return""};
  for(let i=0;i<L.length;i++){
    let l=L[i],t=l.trim();
    if(!t){out.push("");continue}
    if(/^(#{1,6}\s|---|\||>|!\[|```)/.test(t)||/^\d+\.\s/.test(t)){out.push(l);if(first&&/^#/.test(t))first=false;continue}
    if(isBul(t)){
      let b=t.replace(/^([•▸▪◦\-\*]\s*)+/,"");
      b=b.replace(/^([^:*\[\]]{2,40}):\s/,"**$1:** ");
      out.push("- "+b);continue}
    const n=nxt(i).trim();
    if(first){out.push("# "+t);first=false;continue}
    if(/^(completed|done|in progress|blocked|planned|next|upcoming|blockers?)\b[^.]{0,20}$/i.test(t)){out.push("## "+t);continue}
    if(/^[\p{Extended_Pictographic}\u2600-\u27BF]/u.test(t)&&!t.startsWith("✅")&&t.length<80&&(nxt(i).startsWith("✅")||isBul(n))&&!/[.!]$/.test(t)){out.push("## "+t);continue}
    if(t.length<70&&isBul(n)&&!out.length==false){out.push("### "+t.replace(/^✅\s*/,""));continue}
    if(t.startsWith("✅")&&t.length<90&&isBul(n)){out.push("### "+t.replace(/^✅\s*/,"✅ ").replace("✅ ",""));continue}
    out.push(t)
  }
  // blank lines around lists/headings so markdown behaves
  const fin=[];
  out.forEach((l,i)=>{const p=fin[fin.length-1]??"";
    if(/^#{1,3} /.test(l)&&p!=="")fin.push("");
    if(/^- /.test(l)&&p!==""&&!/^- /.test(p))fin.push("");
    if(!/^- /.test(l)&&l!==""&&/^- /.test(p))fin.push("");
    fin.push(l)});
  return fin.join("\n");
}
function render(raw){
  const html=DOMPurify.sanitize(marked.parse(normalize(raw),{breaks:true,gfm:true}));
  const box=document.createElement("div");box.innerHTML=html;
  box.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tw";t.replaceWith(w);w.appendChild(t)});
  box.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer"});
  const frag=document.createElement("div");let sec=null;
  [...box.childNodes].forEach(n=>{
    if(n.nodeType===1&&n.tagName==="H1"){frag.appendChild(n);
      const nx=n.nextElementSibling; if(nx&&nx.tagName==="P"&&!nx.querySelector("img")){nx.classList.add("lead")}
      return}
    if(n.nodeType===1&&n.tagName==="H2"){sec=document.createElement("section");sec.className="sec";
      const tx=n.textContent.toLowerCase();
      if(/in progress/.test(tx))sec.classList.add("s-prog");else if(/^\W*(completed|done)/.test(tx))sec.classList.add("s-done");
      frag.appendChild(sec);sec.appendChild(n);return}
    if(n.nodeType===1&&n.classList.contains("lead")){frag.appendChild(n);return}
    (sec||frag).appendChild(n)});
  frag.querySelectorAll("p.lead").forEach(()=>{});
  const h1=frag.querySelector("h1");
  if(h1&&h1.nextElementSibling&&h1.nextElementSibling.tagName==="P")h1.nextElementSibling.classList.add("lead");
  return frag.innerHTML;
}
function titleOf(raw){const f=raw.split("\n").find(l=>l.trim())||"Untitled";return f.replace(/^#+\s*/,"").slice(0,70)}
function paint(){
  const v=$("src").value.trim(),it=items.find(x=>x.id===cur);
  const d=it&&it.at?new Date(it.at).toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}):"";
  const tp=$("type").value;
  $("view").innerHTML=v?`<span class="tag ${tp} kicker">${tp} update${d?" · "+d:""}</span>`+render(v):'<div class="empty">'+(canEdit?"Paste an update on the left.<br>The formatted version appears here.":"Open the link you were sent to see an update.")+'</div>'
}
function renderList(){
  const l=$("list");l.innerHTML="";
  if(!items.length){l.innerHTML='<p class="hint" style="margin:8px">No updates yet.</p>';return}
  items.forEach(it=>{const b=document.createElement("button");b.className="item"+(cur===it.id?" on":"");
    const d=new Date(it.at).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    b.innerHTML=`<b></b><small><span class="tag ${it.type}">${it.type}</span>${d}</small>`;
    b.querySelector("b").textContent=it.title;
    b.onclick=()=>{location.hash=it.id;open(it.id)};
    l.appendChild(b)})
}
function open(id){
  cur=id||null;const it=items.find(x=>x.id===id);
  $("src").value=it?it.raw||"":"";$("type").value=it?it.type||"Weekly":"Weekly";$("title").value=it?it.custom||"":"";
  document.body.classList.toggle("hasid",!!it);
  $("linkrow").hidden=true;paint();renderList()
}
function touch(){
  const raw=$("src").value;if(!raw.trim())return false;
  if(!cur){cur="u-"+Date.now().toString(36);location.hash=cur;document.body.classList.add("hasid")}
  const old=items.find(x=>x.id===cur),custom=$("title").value.trim();
  const rec={id:cur,raw,type:$("type").value,custom,title:custom||titleOf(raw),at:(old&&old.at)||Date.now(),updatedAt:Date.now()};
  if(old)Object.assign(old,rec);else items.unshift(rec);
  dirty=true;setStatus("Unpublished changes");renderList();return true
}
function queueSave(){if(canEdit)touch();paint()}
async function publish() {
  if (!canEdit) return false;
  if ($("src").value.trim()) touch();
  
  try {
    const { error } = await sb.from("updates").upsert(items);
    if (error) { console.error("Supabase upsert error:", error); throw error; }
    try { localStorage.setItem("team_updates", JSON.stringify(items)); } catch(_) {}
    setStatus("Saved to Supabase ✓");
    dirty = false;
    return true;
  } catch(e) {
    setStatus("Error saving to Supabase");
    return false;
  }
}
["src","title"].forEach(i=>$(i).addEventListener("input",queueSave));
$("type").addEventListener("change",queueSave);
$("pub").onclick=publish;
$("new").onclick=()=>{if(!canEdit)return;history.replaceState(null,"",location.pathname+location.search);open(null);document.body.classList.remove("hasid");$("src").focus()};
$("copy").onclick = async () => {
  if (!$("src").value.trim()) return;
  if (!cur) touch();
  
  const url = window.location.origin + window.location.pathname + "#" + cur;
  $("linkbox").value = url;
  $("linkrow").hidden = false;
  $("linkbox").select();
  
  try {
    await navigator.clipboard.writeText(url);
    setStatus("Link copied ✓");
  } catch(e) {
    setStatus("Select and copy the link below");
  }
  if (dirty) publish();
};
let armed = false;
$("del").onclick = async () => {
  if (!cur || !canEdit) return;
  if (!armed) {
    armed = true;
    $("del").textContent = "Click again to delete";
    setTimeout(() => { armed = false; $("del").textContent = "Delete"; }, 3000);
    return;
  }
  armed = false;
  $("del").textContent = "Delete";
  
  try { await sb.from("updates").delete().eq("id", cur); } catch(e) { console.error("Supabase delete error:", e); }
  
  items = items.filter(x => x.id !== cur);
  cur = null;
  dirty = true;
  history.replaceState(null, "", location.pathname + location.search);
  await publish();
  open(null);
};
const pres=()=>{document.body.classList.add("present");try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}};
$("present").onclick=pres;$("present2").onclick=pres;
$("exit").onclick=()=>{document.body.classList.remove("present");try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.body.classList.remove("present")});
window.addEventListener("hashchange",()=>{const h=hashId();if(h&&h!==cur&&items.find(x=>x.id===h))open(h)});

// Initialize auth and load data
(async () => {
  renderAuthForm();
  const { data: sessionData } = await sb.auth.getSession();
  if (sessionData.session) {
    user = sessionData.session.user;
    canEdit = !!user;
  }
  updateAuthUI();
  maybeAddLogoutBtn();

  await loadItems();

  // Check for hash link on initial page load
  if (items.find(x => x.id === h0)) {
    open(h0);
    // Auto-enter presentation mode only if not logged in and opening a shared link
    if (!user && h0) pres();
  } else {
    open(items[0] ? items[0].id : null);
  }

  setStatus("Ready");
  paint();
})();
</script>
</body>
</html>
